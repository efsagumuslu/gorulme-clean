workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      android_signing:
        - gorulme_keystore
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
          npm install @capacitor-community/admob
      - name: Add Android platform
        script: npx cap add android
      - name: Generate icon and splash screen
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
      - name: Sync Capacitor with Android
        script: npx cap sync android
      - name: Configure release signing
        script: |
          cat > /tmp/sign.js << 'ENDOFSCRIPT'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let c = fs.readFileSync(p, 'utf8');
          c = c.replace(/release\s*\{/, 'release {\n            signingConfig signingConfigs.release');
          const block = `
    signingConfigs {
        release {
            storeFile file(System.getenv("CM_KEYSTORE_PATH"))
            storePassword System.getenv("CM_KEYSTORE_PASSWORD")
            keyAlias System.getenv("CM_KEY_ALIAS")
            keyPassword System.getenv("CM_KEY_PASSWORD")
        }
    }
`;
          c = c.replace('android {', 'android {' + block);
          fs.writeFileSync(p, c);
          console.log('build.gradle patched for release signing');
          ENDOFSCRIPT
          node /tmp/sign.js
      - name: Build signed Android App Bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
