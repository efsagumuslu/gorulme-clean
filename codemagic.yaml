workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      android_signing:
        - gorulme-keystore
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
          npm install @capacitor-community/admob
          npm install @capacitor/app
          npm install @capacitor-community/in-app-review
      - name: Minify game code
        script: |
          npm install terser --no-save
          node scripts/minify-game.js
      - name: Add Android platform
        script: npx cap add android
      - name: Configure orientation lock
        script: node scripts/configure-orientation.js
      - name: Generate icon and splash screen
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
      - name: Sync Capacitor with Android
        script: npx cap sync android
      - name: Configure release signing
        script: node scripts/configure-signing.js
      - name: Build signed Android App Bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gorulme_asc_key
    environment:
      node: 22
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.gorulme.app"
        APP_STORE_APPLE_ID: 6810249133
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
          npm install @capacitor-community/admob
          npm install @capacitor/app
          npm install @capacitor-community/in-app-review
      - name: Minify game code
        script: |
          npm install terser --no-save
          node scripts/minify-game.js
      - name: Add iOS platform
        script: |
          npm install @capacitor/ios
          npx cap add ios --packagemanager Cocoapods
      - name: Generate icon and splash screen
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --ios
      - name: Configure iOS AdMob settings
        script: node scripts/configure-ios-admob.js
      - name: Sync Capacitor with iOS
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
      - name: Build iOS app
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
